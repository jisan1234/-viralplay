<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 40px 20px; }
        .box { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; }
        input, textarea { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 12px; margin-top: 8px; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 300px; font-family: monospace; }
        button { background: #e50914; color: #fff; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 6px; }
        #loginBox { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button type="button" onclick="checkLogin()">Login</button>
        <p id="loginErr" style="color:red; margin-top:10px;"></p>
    </div>

    <div class="box" id="adminPanel" style="display:none;">
        <h2>Raw HTML Publisher</h2>
        <form id="postForm">
            <label>Post Title</label>
            <input type="text" id="title" required placeholder="ভিডিও বা পোস্টের টাইটেল দিন...">

            <label>Thumbnail URL (মেইন পেজে দেখানোর জন্য)</label>
            <input type="text" id="thumbnail" required placeholder="https://image-link.com/photo.jpg">

            <label>Paste Full HTML Code</label>
            <textarea id="rawHtml" required placeholder="<div>তোর ফুল এইচটিএমএল কোড এখানে পেস্ট কর...</div>"></textarea>

            <button type="submit">Publish Post</button>
        </form>
        <p id="msg" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient('https://xswyniefksqqcxougrhg.supabase.co', 'sb_publishable_TzBtcqBFPHJa3Zl73-eBYQ_ELZcD21Q');

        function checkLogin() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === "jisan9946") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('loginErrinnerText' || 'loginErr').innerText = 'Wrong Password!';
                document.getElementById('loginErr').innerText = 'Wrong Password! আবার চেষ্টা কর।';
            }
        }

        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const thumbnail_url = document.getElementById('thumbnail').value;
            const content_html = document.getElementById('rawHtml').value;
            const msg = document.getElementById('msg');

            const slug = title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-') + '-' + Date.now();

            msg.style.color = "#ff0";
            msg.innerText = "Publishing...";

            const { error } = await supabase.from('video_posts').insert([
                { title, slug, thumbnail_url, content_html, status: 'published' }
            ]);

            if (error) {
                msg.style.color = "#f43f5e";
                msg.innerText = "Error: " + error.message;
            } else {
                msg.style.color = "#22c55e";
                msg.innerText = "Published Successfully!";
                document.getElementById('postForm').reset();
            }
        });
    </script>
</body>
</html>
